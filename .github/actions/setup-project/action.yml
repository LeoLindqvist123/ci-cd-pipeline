name: Install
description: Installs Python and project dependencies with uv cache

inputs:
  python-version:
    description: Which Python version to use
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      run: uv python install ${{ inputs.python-version }}
      shell: bash

    - name: Install dependencies
      run: uv sync --all-extras
      shell: bash
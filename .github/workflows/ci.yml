name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      datafil:
        description: "Data file to validate"
        type: choice
        options:
          - data/kundbas.csv
          - data/kundbas_ny_leverans.csv
        default: "data/kundbas.csv"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  andringar:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      kod: ${{ steps.filter.outputs.kod }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            kod:
              - "src/**"
              - "data/**"
              - "tests/**"
              - "kontroll/**"
              - "pyproject.toml"
              - ".github/workflows/**"
              - ".github/actions/**"

  test:
    name: Lint and Test
    needs: andringar
    if: needs.andringar.outputs.kod == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/installera
        with:
          python-version: ${{ matrix.python-version }}
          paket: ".[dev]"

      - name: Check code quality with Ruff
        run: ruff check .

      - name: Run tests with Pytest
        run: pytest

  validera:
    name: Validate Data
    needs: andringar
    if: needs.andringar.outputs.kod == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/installera
        with:
           paket: ".[data]"

      - name: Validate customer data
        env:
          DATAFIL: ${{ inputs.datafil || 'data/kundbas.csv' }}
        run: python kontroll/schema.py "$DATAFIL"

  train:
    name: Train Model
    needs: [test, validera]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/installera

      - name: Train churn model
        run: python -m churn.model

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

  utvardera:
    name: Evaluate Model
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/installera

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Write metrics to Summary
        run: |
          echo "## Metrics for model-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          jq -r 'to_entries[] | "| \(.key) | \(.value) |"' outputs/matvarden.json >> $GITHUB_STEP_SUMMARY

      - name: Evaluate model against threshold
        run: python -m churn.evaluate

  ci-klar:
    name: CI Status Check
    needs: [andringar, test, validera, train, utvardera]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify that no job failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All checks passed."

  ringlista:
    name: Generate Call List
    needs: utvardera
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/installera

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Score customers
        run: python -m churn.score

      - name: Upload call list artifact
        uses: actions/upload-artifact@v4
        with:
          name: ringlista-${{ github.sha }}
          path: outputs/ringlista.csv
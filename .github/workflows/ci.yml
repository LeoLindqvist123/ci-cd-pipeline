name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - "src/**"
              - "data/**"
              - "tests/**"
              - "kontroll/**"
              - "pyproject.toml"
              - "Dockerfile"
              - ".dockerignore"
              - ".github/workflows/**"
              - ".github/actions/**"

  test:
    name: Lint and Test
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/setup-project
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check code quality with Ruff
        run: uv run ruff check .

      - name: Run tests with Pytest
        run: uv run pytest

  validate:
    name: Validate Data (${{ matrix.datafile }})
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - datafile: data/kundbas.csv
            expect: pass
          - datafile: data/kundbas_ny_leverans.csv
            expect: fail
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/setup-project

      - name: Validate data file
        env:
          DATAFILE: ${{ matrix.datafile }}
          EXPECT: ${{ matrix.expect }}
        run: |
          set +e
          uv run python kontroll/schema.py "$DATAFILE" 2>&1 | tee validation.log
          status=${PIPESTATUS[0]}
          set -e

          {
            echo "### \`$DATAFILE\` (expected: $EXPECT)"
            echo '```'
            cat validation.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$EXPECT" == "pass" && $status -ne 0 ]]; then
            echo "::error::$DATAFILE should pass validation but failed"
            exit 1
          fi
          if [[ "$EXPECT" == "fail" && $status -eq 0 ]]; then
            echo "::error::$DATAFILE should fail validation but passed - is the schema too loose?"
            exit 1
          fi
          echo "Result matched expectation: $EXPECT"

  train:
    name: Train Model
    needs: [test, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/setup-project

      - name: Train churn model
        run: uv run python -m churn.model

      - name: Upload candidate model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-candidate-${{ github.sha }}
          path: outputs/
          retention-days: 1

  evaluate:
    name: Evaluate and Version Model
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/setup-project

      - name: Download candidate model artifact
        uses: actions/download-artifact@v4
        with:
          name: model-candidate-${{ github.sha }}
          path: outputs/

      - name: Write metrics and lineage to Summary
        run: |
          echo "## Metrics and Lineage for model-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          jq -r 'to_entries[] | "| \(.key) | \(.value) |"' outputs/matvarden.json >> $GITHUB_STEP_SUMMARY

      - name: Evaluate model against threshold
        run: uv run python -m churn.evaluate

      - name: Version approved model artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.sha }}
          path: outputs/

  package:
    name: Package and Publish Docker Image
    needs: evaluate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download approved model artifact
        uses: actions/download-artifact@v4
        with:
          name: model-${{ github.sha }}
          path: outputs/

      - name: Build Docker image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}/churn-api"
          # Convert to lowercase to avoid Docker naming issues
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          docker build -t "$IMAGE_NAME:${{ github.sha }}" -t "$IMAGE_NAME:latest" .

      - name: Start container in background
        run: |
          docker run -d --name churn-test-service -p 8000:8000 "${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Run container smoke test
        run: |
          python tests/smoke_test.py http://localhost:8000

      - name: Stop and cleanup container
        if: always()
        run: |
          docker logs churn-test-service
          docker rm -f churn-test-service

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ env.IMAGE_NAME }}:latest"

  ci-complete:
    name: CI Status Check
    needs: [changes, test, validate, train, evaluate, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify that no job failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All checks passed."

  call-list:
    name: Generate Call List
    needs: evaluate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/setup-project

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model-${{ github.sha }}
          path: outputs/

      - name: Score customers
        run: uv run python -m churn.score

      - name: Upload call list artifact
        uses: actions/upload-artifact@v4
        with:
          name: call-list-${{ github.sha }}
          path: outputs/ringlista.csv
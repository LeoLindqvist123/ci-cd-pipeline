package:
    name: Package and Publish Docker Image
    needs: evaluate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download approved model artifact
        uses: actions/download-artifact@v4
        with:
          name: model-${{ github.sha }}
          path: outputs/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with layer caching
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}/churn-api"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

          START_TIME=$(date +%s)
          docker buildx build \
            --load \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            -t "$IMAGE_NAME:latest" \
            .
          END_TIME=$(date +%s)
          BUILD_SECONDS=$((END_TIME - START_TIME))

          IMAGE_SIZE_BYTES=$(docker image inspect "$IMAGE_NAME:${{ github.sha }}" --format='{{.Size}}')
          IMAGE_SIZE_MB=$(python3 -c "print(f'{$IMAGE_SIZE_BYTES / (1024 * 1024):.2f}')")

          {
            echo "## 🐳 Docker Optimization Metrics (VG Evaluation)"
            echo "| Metric | Baseline (Single-stage, no cache) | Optimized (Multi-stage + Buildx GHA) |"
            echo "|---|---|---|"
            echo "| Build Duration | 16s | **${BUILD_SECONDS}s** |"
            echo "| Uncompressed Image Size | ~620 MB (incl. uv binary & cache) | **${IMAGE_SIZE_MB} MB** |"
            echo "| Security / Driftsäkerhet | Root user, no healthcheck | **Non-root user (appuser) + Docker Healthcheck** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run container for smoke test
        run: |
          docker run -d --name churn-test-service -p 8000:8000 "${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Run container smoke test
        run: |
          python tests/smoke_test.py http://localhost:8000

      - name: Inspect container logs on failure
        if: failure()
        run: |
          docker logs churn-test-service || true

      - name: Stop and cleanup container
        if: always()
        run: |
          docker rm -f churn-test-service || true

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ env.IMAGE_NAME }}:latest"